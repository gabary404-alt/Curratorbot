<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101725" />
  <title>Currator Bot · Voice Console</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div class="logo" aria-hidden="true">◉</div>
      <div><h1>Currator Bot</h1><p>Kinyarwanda-first AI companion</p></div>
      <span id="status" class="status">Connecting…</span>
    </header>
    <section class="stage" aria-label="Robot display">
      <div class="face" id="face"><span class="eye left"></span><span class="eye right"></span><span class="smile"></span></div>
      <p id="activity" class="activity" role="status"></p>
      <p class="caption" id="mood">Muraho! Hello! I'm Currator.</p>
      <p id="mode-warning" class="mode-warning"></p>
    </section>
    <div class="toolbar">
      <label for="lang">Language</label>
      <select id="lang"><option value="auto">Auto detect</option><option value="rw">Kinyarwanda</option><option value="en">English</option></select>
      <label for="retrieval">Sources</label>
      <select id="retrieval"><option value="auto">Auto</option><option value="on">Research</option><option value="off">Chat only</option></select>
    </div>
    <section class="conversation" id="conversation" role="log" aria-live="polite" aria-label="Conversation">
      <div class="bubble bot">Muraho neza! Greet me or ask me a question.</div>
    </section>
    <form id="chat-form" class="compose">
      <button type="button" id="record" class="record" aria-label="Record spoken question" aria-pressed="false" title="Tap to record" disabled>🎙</button>
      <input id="prompt" maxlength="1500" placeholder="Andika ikibazo cyawe… / Ask a question" aria-label="Question" required />
      <button id="send" type="submit" disabled>Send</button>
    </form>
    <div class="bottom"><span id="hint" role="status">Connecting…</span><button type="button" id="stop-audio" disabled>Stop speech</button></div>
    <p class="privacy">Voice mode sends recorded questions to the speech provider.</p>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
