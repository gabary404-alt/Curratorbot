[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "currator-bot"
version = "0.1.0"
description = "Currator Bot: Kinyarwanda-first bilingual AI companion and safe robot bridge"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.8"]
serial = ["pyserial>=3.5,<4"]
english = ["vosk>=0.3.45,<0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
currator = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
